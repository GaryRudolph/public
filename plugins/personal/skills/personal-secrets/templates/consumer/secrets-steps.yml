# Consumer steps for a repo that reads <org>/<estate>-secrets. Paste into a
# job and keep only the decrypt step(s) the job needs, using the narrowest
# one that works (see the least-privilege order below).
#
# Prerequisites, done by a maintainer in the secrets repo:
#   make mint REPO=<repo> CONTEXT=actions   # and agents / codespaces if used
#   grant <repo>__actions in access.map, make build, commit
#   CONFIRM_SET_KEYS=1 make set-keys REPO=<repo> CONTEXT=actions
# And in this repo: vars.SECRETS_APP_CLIENT_ID and secrets.SECRETS_APP_PRIVATE_KEY
# for the read-only Secrets GitHub App.
#
# Under Actions, dist-decrypt-env masks every value it prints (::add-mask:: on
# stderr), so capture stdout with $(...) and leave stderr alone.

      - uses: actions/create-github-app-token@v3
        id: secrets-token
        with:
          client-id: ${{ vars.SECRETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECRETS_APP_PRIVATE_KEY }}
          owner: <org>
          repositories: <estate>-secrets
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: <org>/<estate>-secrets
          token: ${{ steps.secrets-token.outputs.token }}
          sparse-checkout: dist        # plus root files; never src/, keys/, scripts/
          path: _secrets
          fetch-depth: 1

      - uses: nhedger/setup-sops@v3    # sops, with age support built in

      # 1. Narrowest: one value for one command; nothing lands in the job env.
      - name: Build with one secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: AUTH_TOKEN="$(make -s -C _secrets dist-decrypt-env KEY=AUTH_TOKEN)" npm run build

      # 2. One value for several commands in one step. A later step that needs
      #    it decrypts it again. Never append a value to $GITHUB_ENV: every
      #    later step gets it and its log prints it. A repo whose workflow did
      #    (this template's old step 2) rotates every value it exported.
      - name: Build and upload with one secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          AUTH_TOKEN="$(make -s -C _secrets dist-decrypt-env KEY=AUTH_TOKEN)"
          export AUTH_TOKEN
          npm run build
          npm run upload

      # 3. Files on disk, only when the toolchain needs a file (certs, .p8, .p12).
      - name: Decrypt signing key to disk
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: make -s -C _secrets dist-decrypt FILE=ios/AuthKey_ABC123.p8
