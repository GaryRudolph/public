# Consumer steps for a repo that reads <org>/<estate>-secrets. Paste into a
# job and keep only the decrypt step(s) the job needs, using the narrowest
# one that works (see the least-privilege order below).
#
# Prerequisites, done by a maintainer in the secrets repo:
#   make mint REPO=<repo> CONTEXT=actions   # and agents / codespaces if used
#   grant <repo>__actions in access.map, make build, commit
#   CONFIRM_SET_KEYS=1 make set-keys REPO=<repo> CONTEXT=actions
# And in this repo: vars.SECRETS_APP_ID and secrets.SECRETS_APP_PRIVATE_KEY
# for the read-only Secrets GitHub App.

      - uses: actions/create-github-app-token@v1
        id: secrets-token
        with:
          app-id: ${{ vars.SECRETS_APP_ID }}
          private-key: ${{ secrets.SECRETS_APP_PRIVATE_KEY }}
          owner: <org>
          repositories: <estate>-secrets
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          repository: <org>/<estate>-secrets
          token: ${{ steps.secrets-token.outputs.token }}
          sparse-checkout: dist        # plus root files; never src/, keys/, scripts/
          path: _secrets
          fetch-depth: 1

      - uses: nhedger/setup-sops@v2    # sops, with age support built in

      # 1. Narrowest: one value for one command; nothing lands in the job env.
      - name: Build with one secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: PUBLIC_API_URL="$(make -s -C _secrets dist-decrypt-env KEY=PUBLIC_API_URL)" npm run build

      # 2. Export to the job environment for later steps: one key, or all.
      - name: Export one secret for later steps
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: make -s -C _secrets dist-decrypt-env KEY=PUBLIC_API_URL FORMAT=dotenv >> "$GITHUB_ENV"

      # 3. Files on disk, only when the toolchain needs a file (certs, .p8, .p12).
      - name: Decrypt signing key to disk
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: make -s -C _secrets dist-decrypt FILE=ios/AuthKey_ABC123.p8
