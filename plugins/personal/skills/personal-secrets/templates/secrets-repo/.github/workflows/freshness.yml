# Keyless freshness check: no age key and no secrets. Fails a push, PR or
# merge-queue run that changes src/ without matching dist/, commits
# plaintext, or leaves access.map and dist/ out of step.
#
# It also runs on merge_group, because a required check that never reports
# there stalls the merge queue. In the queue it checks base_sha..sha, what the
# queue is about to land; without a range `make ci` skips the pairing check.
name: freshness

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keyless checks
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = merge_group ]; then
            range="${{ github.event.merge_group.base_sha }}..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if git cat-file -e "${range%%.*}" 2>/dev/null; then
            make ci RANGE="$range"
          else
            make ci
          fi
