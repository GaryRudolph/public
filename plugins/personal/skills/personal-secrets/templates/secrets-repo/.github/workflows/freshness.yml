# Keyless freshness check: no age key and no secrets. Fails a push, PR or
# merge-queue run that changes src/ without matching dist/, commits
# plaintext, or leaves access.map and dist/ out of step.
#
# It also runs on merge_group, because a required check that never reports
# there stalls the merge queue. In the queue it checks base_sha..sha, what the
# queue is about to land.
#
# It fails closed: only the first push of main (no before commit) runs
# without a range. A base it can't resolve, after trying to fetch it, fails
# the check rather than skipping the pairing rules.
name: freshness

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keyless checks
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = merge_group ]; then
            range="${{ github.event.merge_group.base_sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            range=""
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if [ -z "$range" ]; then
            make ci
            exit 0
          fi
          # A force-push can leave the base unreachable from any ref; fetch it
          # by SHA. If it's still missing, make ci fails on the range.
          base=${range%%.*}
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q origin "$base" || true
          make ci RANGE="$range"
