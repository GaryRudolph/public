# secrets/.sops.yaml: one creation rule per scope, per the personal secrets
# standard (standards/secrets/single-repo.md). The Makefile runs sops from
# secrets/, so paths start at the scope folder.
#
# A scope is a folder with one set of recipients. ci/ opens with the repo's
# Actions key; every other scope is the GitHub environment of the same name.
# Each key is written once, as an anchor named for its identity (a GitHub
# login, breakglass, or the CI context). After changing a scope's keys, run
# `make secrets-updatekeys SCOPE=<scope>` (add ROTATE=1 when one was removed).
#
# Never add encrypted_regex, *_suffix or mac_only_encrypted: every value is
# encrypted, and `make secrets-check` fails on them.
creation_rules:
  - path_regex: ^ci/.+\.sops$
    key_groups:
      - age:
          - &maintainer <maintainer-age-public-key>   # replace the anchor name with the GitHub login
          - &breakglass <breakglass-age-public-key>   # offline
          - &actions    <actions-age-public-key>      # <repo>__actions
  - path_regex: ^dev/.+\.sops$
    key_groups:
      - age:
          - *maintainer
          - *breakglass
          - &env_dev    <env-dev-age-public-key>      # <repo>__env-dev
  - path_regex: ^prod/.+\.sops$
    key_groups:
      - age:
          - *maintainer
          - *breakglass
          - &env_prod   <env-prod-age-public-key>     # <repo>__env-prod
