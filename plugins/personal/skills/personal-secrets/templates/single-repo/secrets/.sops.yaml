# secrets/.sops.yaml: one creation rule per scope, per the personal secrets
# standard (standards/secrets/single-repo.md). The Makefile runs sops from
# secrets/, so paths start at the scope folder.
#
# A scope is a folder with one set of recipients. ci/ opens with the repo's
# Actions key; every other scope is the GitHub environment of the same name.
# Each key is written once, as an anchor named for its identity (a GitHub
# login, breakglass, or the CI context), with the month it was minted in its
# comment: rotation is due 9 months later, 12 for break-glass. After changing
# a scope's keys, run `make secrets-updatekeys SCOPE=<scope>` (add ROTATE=1
# when one was removed).
#
# Never add encrypted_regex, *_suffix or mac_only_encrypted: every value is
# encrypted, and `make secrets-check` fails on them.
creation_rules:
  - path_regex: ^ci/.+\.sops$
    key_groups:
      - age:
          - &maintainer <maintainer-age-public-key>   # GitHub login as the anchor name; minted YYYY-MM
          - &breakglass <breakglass-age-public-key>   # offline, two custodians; minted YYYY-MM
          - &actions    <actions-age-public-key>      # <repo>__actions; minted YYYY-MM
  - path_regex: ^dev/.+\.sops$
    key_groups:
      - age:
          - *maintainer
          - *breakglass
          - &env_dev    <env-dev-age-public-key>      # <repo>__env-dev; minted YYYY-MM
  - path_regex: ^prod/.+\.sops$
    key_groups:
      - age:
          - *maintainer
          - *breakglass
          - &env_prod   <env-prod-age-public-key>     # <repo>__env-prod; minted YYYY-MM
