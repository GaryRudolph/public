<svg xmlns="http://www.w3.org/2000/svg" width="960" height="654" viewBox="0 0 960 654" role="img" aria-labelledby="title desc">
  <title id="title">One Mac, two Claude accounts</title>
  <desc id="desc">Primary is the default: the Claude app and the claude command launched normally use ~/Library/Application Support/Claude and ~/.claude. Secondary, which you name, uses the Claude &lt;Secondary&gt; launcher and the claude-&lt;secondary&gt; command, which point the same apps at ~/Library/Application Support/Claude-&lt;secondary&gt; and ~/.claude-&lt;secondary&gt;. While running, both look like plain Claude in the Dock. Files, git and SSH keys are shared.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
    <g id="claude-icon">
      <rect width="56" height="56" rx="13" fill="#D97757"/>
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
        <line x1="28" y1="13" x2="28" y2="43"/>
        <line x1="13" y1="28" x2="43" y2="28"/>
        <line x1="17.5" y1="17.5" x2="38.5" y2="38.5"/>
        <line x1="38.5" y1="17.5" x2="17.5" y2="38.5"/>
      </g>
    </g>
    <g id="folder">
      <path d="M0 4 a3 3 0 0 1 3 -3 h7 l3 3 h11 a3 3 0 0 1 3 3 v12 a3 3 0 0 1 -3 3 h-21 a3 3 0 0 1 -3 -3 z" fill="#FCD34D" stroke="#D9A514" stroke-width="1"/>
    </g>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; fill: #111827; }
    .sub { font-size: 14px; fill: #6B7280; }
    .colhead { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; fill: #6B7280; }
    .body { font-size: 13.5px; fill: #374151; }
    .strong { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .code { font-size: 12px; fill: #111827; }
    .term { font-size: 13px; fill: #E5E7EB; }
  </style>

  <rect width="960" height="654" rx="18" fill="#FAF8F4"/>

  <text x="40" y="50" class="sans h1">One Mac, two Claude accounts</text>
  <text x="40" y="74" class="sans sub">Same apps. Different folder, different login.</text>

  <!-- ======================= Primary column ======================= -->
  <g transform="translate(40,96)">
    <rect width="420" height="40" rx="10" fill="#2563EB"/>
    <text x="18" y="26" class="sans colhead">Primary</text>
    <rect x="330" y="10" width="76" height="20" rx="10" fill="#DBEAFE"/>
    <text x="368" y="24" text-anchor="middle" class="sans tag" fill="#1E40AF">DEFAULT</text>

    <!-- start -->
    <rect y="56" width="420" height="130" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="18" y="80" class="sans label">HOW YOU START IT</text>
    <use href="#claude-icon" x="26" y="94"/>
    <text x="54" y="164" text-anchor="middle" class="sans strong" font-size="12.5">Claude</text>
    <text x="104" y="118" class="sans body">the app, as usual</text>
    <rect x="104" y="128" width="190" height="30" rx="7" fill="#1F2937"/>
    <text x="116" y="148" class="mono term"><tspan fill="#9CA3AF">$</tspan> claude</text>
    <text x="306" y="148" class="sans body">in Terminal</text>

    <line x1="210" y1="190" x2="210" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- setting -->
    <rect y="220" width="420" height="72" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="18" y="244" class="sans label" fill="#1E40AF">WHAT IT POINTS AT</text>
    <text x="18" y="272" class="sans body">Nothing set. The normal folders.</text>

    <line x1="210" y1="296" x2="210" y2="320" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- folders -->
    <rect y="326" width="420" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="18" y="350" class="sans label">LOGIN, SETTINGS, HISTORY</text>
    <use href="#folder" x="18" y="364"/>
    <text x="56" y="376" class="sans strong">Claude app</text>
    <text x="56" y="394" class="mono code">~/Library/Application Support/Claude</text>
    <use href="#folder" x="18" y="406"/>
    <text x="56" y="418" class="sans strong">Claude Code</text>
    <text x="56" y="436" class="mono code">~/.claude</text>
  </g>

  <!-- ========================= Secondary column======================== -->
  <g transform="translate(500,96)">
    <rect width="420" height="40" rx="10" fill="#C2410C"/>
    <text x="18" y="26" class="sans colhead">Secondary</text>
    <rect x="316" y="10" width="90" height="20" rx="10" fill="#FFEDD5"/>
    <text x="361" y="24" text-anchor="middle" class="sans tag" fill="#9A3412">YOU NAME IT</text>

    <!-- start -->
    <rect y="56" width="420" height="130" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="18" y="80" class="sans label">HOW YOU START IT</text>
    <use href="#claude-icon" x="26" y="94"/>
    <circle cx="76" cy="142" r="13" fill="#C2410C" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="76" y="147" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">S</text>
    <text x="54" y="164" text-anchor="middle" class="sans strong" font-size="12.5">Claude</text>
    <text x="54" y="179" text-anchor="middle" class="sans strong" font-size="11.5">&lt;Secondary&gt;</text>
    <text x="104" y="104" class="sans body">launcher in ~/Applications</text>
    <text x="104" y="120" class="sans" font-size="11.5" fill="#9A3412">badge is optional</text>
    <rect x="104" y="128" width="190" height="30" rx="7" fill="#1F2937"/>
    <text x="116" y="148" class="mono term"><tspan fill="#9CA3AF">$</tspan> claude-&lt;secondary&gt;</text>
    <text x="306" y="148" class="sans body">in Terminal</text>

    <line x1="210" y1="190" x2="210" y2="214" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- setting -->
    <rect y="220" width="420" height="72" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="18" y="244" class="sans label" fill="#9A3412">WHAT IT POINTS AT</text>
    <text x="18" y="264" class="mono code">--user-data-dir=…/Claude-&lt;secondary&gt;</text>
    <text x="18" y="282" class="mono code">CLAUDE_CONFIG_DIR=~/.claude-&lt;secondary&gt;</text>

    <line x1="210" y1="296" x2="210" y2="320" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- folders -->
    <rect y="326" width="420" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="18" y="350" class="sans label">LOGIN, SETTINGS, HISTORY</text>
    <use href="#folder" x="18" y="364"/>
    <text x="56" y="376" class="sans strong">Claude app</text>
    <text x="56" y="394" class="mono code">~/Library/Application Support/Claude-&lt;secondary&gt;</text>
    <use href="#folder" x="18" y="406"/>
    <text x="56" y="418" class="sans strong">Claude Code</text>
    <text x="56" y="436" class="mono code">~/.claude-&lt;secondary&gt;</text>
  </g>

  <!-- ========================= bottom strip ========================= -->
  <g transform="translate(40,562)">
    <rect width="600" height="68" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>
    <rect x="16" y="12" width="100" height="44" rx="10" fill="#E5E7EB"/>
    <use href="#claude-icon" transform="translate(24,16) scale(0.643)"/>
    <use href="#claude-icon" transform="translate(72,16) scale(0.643)"/>
    <circle cx="42" cy="54" r="2" fill="#6B7280"/>
    <circle cx="90" cy="54" r="2" fill="#6B7280"/>
    <text x="132" y="30" class="sans strong">While running, both look like plain Claude</text>
    <text x="132" y="50" class="sans body">in the Dock. Check the account name in the window.</text>

    <rect x="616" width="264" height="68" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="634" y="30" class="sans strong">Shared by both</text>
    <text x="634" y="50" class="sans body">your files, git, SSH keys</text>
  </g>
</svg>
